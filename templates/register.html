<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | CivicConnect</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="register-container">

<div class="register-box">

<h1>Create Account</h1>

<p>Citizen Registration</p>

{% if error %}
<p style="background:#fde8e8; color:#c0392b; padding:10px 14px; border-radius:8px; margin-bottom:15px; text-align:center; font-size:14px;">
    {{ error }}
</p>
{% endif %}

<form action="/register" method="POST">

<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" name="full_name" placeholder="Full Name" required>
</div>

<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="email" name="email" placeholder="Email" required>
</div>

<div class="input-box">
<i class="fa-solid fa-phone"></i>
<input type="tel" name="mobile" placeholder="Mobile Number (10 digits)" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" title="Enter exactly 10 digits" required>
</div>

<div class="input-box">
<i class="fa-solid fa-location-dot"></i>
<input type="text" name="area" placeholder="Area" required>
</div>

<div class="input-box">
<i class="fa-solid fa-hashtag"></i>
<input type="number" name="ward_no" placeholder="Ward Number" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" name="password" placeholder="Password (min 8 chars, A-Z, a-z, 0-9, symbol)" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#^()_+\-=]).{8,}$" title="At least 8 characters, including uppercase, lowercase, number, and special character" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" name="confirm_password" placeholder="Confirm Password" required>
</div>

<button type="submit">Create Account</button>

</form>

<a href="/login">Already have an account? Login</a>

</div>

</div>

<script>
    document.querySelector('input[name="mobile"]').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });
</script>

</body>
</html>
